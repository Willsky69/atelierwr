name: Vérifier la nouvelle image d’en-tête
on:
  push:
    paths:
      - '.github/workflows/check-header-20261118.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre la publication et vérifier
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            page=$(curl -fsSL "https://atelierwr.net/?entete=20261118-${GITHUB_RUN_ATTEMPT}" || true)
            code=$(curl -Lso /tmp/entete.png -w '%{http_code}' "https://atelierwr.net/assets/atelierwr-entete-20261118.png?entete=${GITHUB_RUN_ATTEMPT}" || true)
            if printf '%s' "$page" | grep -Fq 'assets/atelierwr-entete-20261118.png' \
              && ! printf '%s' "$page" | grep -Fq 'assets/atelierwr-entete-20261107.png' \
              && [ "$code" = "200" ] \
              && [ -s /tmp/entete.png ]; then
              echo "Nouvelle image d’en-tête publiée."
              exit 0
            fi
            sleep 10
          done
          echo "La nouvelle image n'est pas encore visible sur le site public." >&2
          exit 1
