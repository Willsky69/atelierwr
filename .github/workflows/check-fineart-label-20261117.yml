name: Vérifier le libellé Fine Art

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-fineart-label-20261117.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le libellé public
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in $(seq 1 18); do
            key="${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --max-time 25 --retry 2 "https://atelierwr.net/fine-art?check=${key}" -o fine.html \
              && grep -q 'Nus et modèles vivants' fine.html \
              && curl -fsSL --max-time 25 --retry 2 "https://atelierwr.net/nus?check=${key}" -o nus.html \
              && grep -q 'Nus et modèles vivants' nus.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1
