name: Vérifier les deux nouvelles encres

on:
  push:
    paths:
      - ".github/workflows/check-encres-20261121.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre et vérifier les pages publiées
        shell: bash
        run: |
          set -euo pipefail
          FR="https://atelierwr.net/mes-dernieres-encres.html?encres=20261121"
          EN="https://atelierwr.net/en/mes-dernieres-encres.html?encres=20261121"
          A1="https://atelierwr.net/assets/ig/21-le-geant-des-mers.png?encres=20261121"
          A2="https://atelierwr.net/assets/ig/22-l-heure-suspendue.png?encres=20261121"
          for i in $(seq 1 60); do
            fr="$(curl -fsSL --max-time 30 "$FR" || true)"
            en="$(curl -fsSL --max-time 30 "$EN" || true)"
            c1="$(curl -sSL -o /tmp/geant.png -w "%{http_code}" --max-time 30 "$A1" || true)"
            c2="$(curl -sSL -o /tmp/heure.png -w "%{http_code}" --max-time 30 "$A2" || true)"
            if printf "%s" "$fr" | grep -q "Le géant des mers" \
              && printf "%s" "$fr" | grep -q "L’heure suspendue" \
              && printf "%s" "$fr" | grep -q "Fine Art · 20 œuvres" \
              && printf "%s" "$en" | grep -q "The sea giant" \
              && printf "%s" "$en" | grep -q "Suspended time" \
              && [ "$c1" = "200" ] && [ "$c2" = "200" ] \
              && [ -s /tmp/geant.png ] && [ -s /tmp/heure.png ]; then
              echo "Les deux nouvelles encres sont publiées."
              exit 0
            fi
            echo "Tentative $i/60 : déploiement en attente (images HTTP $c1 / $c2)."
            sleep 10
          done
          echo "La version publique attendue n'est pas encore disponible."
          exit 1
