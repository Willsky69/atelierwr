name: Synchroniser automatiquement le site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-upstream.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-atelierwr-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'Willsky69/atelierwr'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Récupérer les modifications de l’atelier
        run: |
          git remote add upstream https://github.com/PanameAutomatiseU/atelierwr.git
          git fetch upstream main

      - name: Fusionner les modifications
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "Atelier WR — publication automatique"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit -X theirs upstream/main

      - uses: actions/setup-python@v5
        if: steps.merge.outputs.changed == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/translation-requirements.txt

      - name: Synchroniser la version anglaise
        if: steps.merge.outputs.changed == 'true'
        run: |
          python -m pip install -r scripts/translation-requirements.txt
          curl --fail --location --retry 2 https://argos-net.com/v1/translate-fr_en-1_9.argosmodel -o "$RUNNER_TEMP/fr-en.zip"
          echo "3b3052fee6bb1e8e8e632a26a723eb2a2c7710dfe73ba61ffd9b83e85d4f14c1  $RUNNER_TEMP/fr-en.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/fr-en.zip" -d "$RUNNER_TEMP/atelierwr-model"
          python scripts/translate_site.py "$RUNNER_TEMP/atelierwr-model/translate-fr_en-1_9"
          git add -- '*.html' en sitemap.xml
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Synchroniser la version anglaise"
          fi

      - name: Publier le site bilingue
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main
