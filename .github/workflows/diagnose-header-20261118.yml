name: Diagnostiquer la publication de l’en-tête
on:
  push:
    paths:
      - '.github/workflows/diagnose-header-20261118.yml'
jobs:
  public-page:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la référence sur le domaine public
        run: curl -fsSL "https://atelierwr.net/?diag=${GITHUB_RUN_ID}" | grep -Fq 'atelierwr-entete-20261118.png'
  public-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l’image sur le domaine public
        run: curl -fsSL -o /dev/null "https://atelierwr.net/assets/atelierwr-entete-20261118.png?diag=${GITHUB_RUN_ID}"
  worker-page:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la référence sur Cloudflare direct
        run: curl -fsSL "https://atelierwr.william-rigoulet.workers.dev/?diag=${GITHUB_RUN_ID}" | grep -Fq 'atelierwr-entete-20261118.png'
  worker-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l’image sur Cloudflare direct
        run: curl -fsSL -o /dev/null "https://atelierwr.william-rigoulet.workers.dev/assets/atelierwr-entete-20261118.png?diag=${GITHUB_RUN_ID}"
