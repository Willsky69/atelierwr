name: Vérifier la nouvelle photo de Collaborer

on:
  push:
    paths:
      - ".github/workflows/check-collaborer-photo-v2-20261118.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre et vérifier la page publiée
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://atelierwr.net/designer-graphiste-marseille?photo=20261118-v2"
          ASSET="https://atelierwr.net/assets/collaborer-william-rigoulet-20261118-v2.png?photo=20261118-v2"
          for i in $(seq 1 60); do
            html="$(curl -fsSL --max-time 30 "$PAGE" || true)"
            code="$(curl -sSL -o /tmp/collaborer-v2.png -w "%{http_code}" --max-time 30 "$ASSET" || true)"
            if printf "%s" "$html" | grep -q "assets/collaborer-william-rigoulet-20261118-v2.png" \
              && ! printf "%s" "$html" | grep -q "Parcours &amp; savoir-faire" \
              && [ "$code" = "200" ] \
              && [ -s /tmp/collaborer-v2.png ]; then
              echo "La nouvelle photo de Collaborer et le menu corrigé sont publiés."
              exit 0
            fi
            echo "Tentative $i/60 : déploiement en attente (image HTTP $code)."
            sleep 10
          done
          echo "La version publique attendue n'est pas encore disponible."
          exit 1
