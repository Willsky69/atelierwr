
name: Installer Google Analytics sur toutes les pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - ".github/workflows/install-analytics.yml"

permissions:
  contents: write

concurrency:
  group: analytics-atelierwr
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          measurement_id = "G-GPMLPEQBGY"

          snippet = f"""<!-- Google Analytics 4 -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{measurement_id}');
          </script>
          """

          count = 0
          for file in Path(".").rglob("*.html"):
              if ".git" in file.parts:
                  continue
              html = file.read_text(encoding="utf-8")
              if measurement_id in html:
                  continue
              if not re.search(r"<head\b[^>]*>", html, re.I):
                  continue
              html = re.sub(
                  r"(<head\b[^>]*>)",
                  lambda m: m.group(1) + "\n" + snippet,
                  html,
                  count=1,
                  flags=re.I
              )
              file.write_text(html, encoding="utf-8")
              count += 1
          print(f"Pages mises a jour : {count}")
          PY

      - name: Enregistrer les modifications
        run: |
          git config user.name "Atelier WR Analytics"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Installer Google Analytics GA4"
            git pull --rebase origin main
            git push origin main
          fi
