name: Vérifier la nouvelle adresse
on:
  push:
    paths:
      - '.github/workflows/check-address-20261117.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre la publication et vérifier
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            contact=$(curl -fsSL "https://atelierwr.net/prendre-contact?adresse=20261117-${GITHUB_RUN_ATTEMPT}" || true)
            collaborer=$(curl -fsSL "https://atelierwr.net/designer-graphiste-marseille?adresse=20261117-${GITHUB_RUN_ATTEMPT}" || true)
            if printf '%s' "$contact" | grep -Fq '217 rue d’Endoume, 13007 Marseille' \
              && printf '%s' "$contact" | grep -Fq '"postalCode":"13007"' \
              && printf '%s' "$collaborer" | grep -Fq '"streetAddress":"217 rue d’Endoume"' \
              && printf '%s' "$collaborer" | grep -Fq '"postalCode":"13007"' \
              && ! printf '%s%s' "$contact" "$collaborer" | grep -Fq '121 rue'; then
              echo "Nouvelle adresse publiée et ancienne adresse absente."
              exit 0
            fi
            sleep 10
          done
          echo "La nouvelle adresse n'est pas encore visible sur le site public." >&2
          exit 1
