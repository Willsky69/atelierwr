name: Vérifier le menu Atelier WR
on:
  push:
    paths:
      - '.github/workflows/check-menu-atelier-20261118.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Attendre la publication et vérifier
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            ok=yes
            for route in "" "design-creation" "fine-art" "designer-graphiste-marseille" "prendre-contact"; do
              page=$(curl -fsSL "https://atelierwr.net/$route?menu=20261118-${GITHUB_RUN_ATTEMPT}-$attempt" || true)
              if printf '%s' "$page" | grep -Fq 'Parcours &amp; savoir-faire'; then ok=no; fi
              if ! printf '%s' "$page" | grep -Fq '>Collaborer<'; then ok=no; fi
            done
            if [ "$ok" = "yes" ]; then
              echo "Menu Atelier WR mis à jour sur les pages principales."
              exit 0
            fi
            sleep 10
          done
          echo "Le menu public n'est pas encore à jour." >&2
          exit 1
